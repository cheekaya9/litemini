name: Build liteX shell

# Electron 22 = last line that runs on Windows 7. Produces liteX-x64.exe and liteX-ia32.exe (portable, no install).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. litex-v1)"
        required: true
        default: "litex-v1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: node test-url.js
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: litex
          path: |
            shell/dist/liteX-x64.exe
            shell/dist/liteX-ia32.exe
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "liteX $TAG" \
            --notes "liteX: ويندوز 64 بت = x64 — ويندوز 32 بت = ia32. القائمة العلوية: الموقع ← تغيير الرابط." \
            || gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
